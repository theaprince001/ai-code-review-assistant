spring:
  application:
    name: codereview



  config:
      import: optional:file:.env[.properties]

  datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: ${SERVER_PORT:8080}